services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: spk_saw_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - spk-network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: spk_saw_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - spk-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: spk_saw_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-spksaw_laravel}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_USER: ${DB_USERNAME:-spk_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-spk_password}
    ports:
      - "33066:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - spk-network

networks:
  spk-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
